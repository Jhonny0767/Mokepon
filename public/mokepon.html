<!DOCTYPE html> 
<html>
    <head>
        <meta charset="utf-8" />
        <title>MOKEPON!</title>
        <link rel="stylesheet" href="./styles.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <section id="seleccionar-mascota">

            <h1 class = "titulo">MOKEPON! 🔥💧🌱</h1>

            <h2 class="subtitulo">Elige tu mascota:</h2>

            <div id="contenedorTarjetas" class="tarjetas">
                
            </div>

            <button id="boton-mascota">Seleccionar</button>
        </section>

        <section id="ver-mapa">
            <h1 class="titulo">Recorre el mapa con tu MOKEPON</h1>
            <canvas id="mapa"></canvas>
            <button onpointerup="detenerMovimiento()" onpointerdown="moverArriba()" onpointerleave="detenerMovimiento()">Arriba</button>
            <div>
                <button onpointerup="detenerMovimiento()" onpointerdown="moverIzquierda()" onpointerleave="detenerMovimiento()">Izquierda</button>
                <button onpointerup="detenerMovimiento()" onpointerdown="moverDerecha()" onpointerleave="detenerMovimiento()">Derecha</button>
                <button onpointerup="detenerMovimiento()" onpointerdown="moverAbajo()" onpointerleave="detenerMovimiento()">Abajo</button>
            </div>

        </section>

        <section id="seleccionar-ataque">
            <h1 class = "titulo">MOKEPON! 🔥💧🌱</h1>

            <h2 class="subtitulo">Elige tu ataque:</h2>

            <div id="contenedorAtaques" class="tarjetas-ataques">
                <button id="boton-fuego" class="boton-de-ataque">Fuego 🔥</button>
                <button id="boton-agua" class="boton-de-ataque">Agua 💧</button>
                <button id="boton-tierra" class="boton-de-ataque">Tierra 🌱</button>

            </div>

                <div id="mensajes">
                    <p id="resultado">!!! Mucha Suerte !!!</p>
                    <section id="reiniciar">
                        <button id="boton-reiniciar">Reiniciar</button>
                    </section>
                </div>
               
            <div  class="ataques">
                <div class="ataqueJugador">
                    <p id="vidas-jugador">0</p>
                    <p id="mascota-jugador"></p>
                    <div id="ataque-Jugador"></div>
                </div>
                <div class="ataqueEnemigo">
                    <p id="vidas-enemigo">0</p>
                    <p id="mascota-enemigo"></p>
                    <div id="ataque-Enemigo"></div>
                </div>
            </div>
        </section>
        <script src="./mokepon.js"></script>


    </body>
</html>
